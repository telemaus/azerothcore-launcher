<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Paths</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      padding: 20px 24px;
      background: #f8fafc;
      color: #172033;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 21px;
    }
    .description {
      margin: 0 0 16px;
      color: #64748b;
      font-size: 13px;
    }
    .path-list {
      display: grid;
      gap: 10px;
    }
    .path-row {
      display: grid;
      grid-template-columns: 155px minmax(100px, 1fr) 40px 88px;
      align-items: center;
      gap: 10px;
    }
    label {
      font-size: 13px;
      font-weight: 600;
    }
    input {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      color: #172033;
      font: inherit;
      font-size: 13px;
    }
    input:focus {
      border-color: #2563eb;
      outline: 2px solid #bfdbfe;
    }
    button {
      height: 38px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
    }
    .icon-button {
      display: grid;
      place-items: center;
      background: #e2e8f0;
      color: #334155;
    }
    .icon-button:hover:not(:disabled) {
      background: #cbd5e1;
    }
    .icon-button:disabled {
      cursor: default;
      opacity: .45;
    }
    .browse-button {
      background: #e2e8f0;
      color: #172033;
    }
    .browse-button:hover {
      background: #cbd5e1;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
    }
    #message {
      min-height: 18px;
      color: #b91c1c;
      font-size: 13px;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    .actions button {
      min-width: 90px;
      padding: 0 16px;
    }
    #cancel {
      background: #e2e8f0;
      color: #172033;
    }
    #save {
      background: #16a34a;
      color: white;
    }
    #save:hover {
      background: #15803d;
    }
    @media (max-width: 700px) {
      body {
        padding: 16px 18px;
      }
      .path-row {
        grid-template-columns: 1fr 40px 78px;
      }
      .path-row label {
        grid-column: 1 / -1;
      }
      .footer {
        align-items: flex-end;
      }
    }
  </style>
</head>
<body>
  <h1>Server paths</h1>
  <p class="description">View or change each configured file. Use the folder icon to show it in File Explorer.</p>

  <div class="path-list">
    <div class="path-row">
      <label for="dbPath">MySQL server or script</label>
      <input id="dbPath" type="text" spellcheck="false" placeholder="Required (.bat or mysqld.exe)" />
      <button class="icon-button" data-reveal="db" title="Show MySQL file in File Explorer" aria-label="Show MySQL file in File Explorer">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v1H8a2 2 0 0 0-1.7.9L3 16V7Z"></path><path d="m3 16 2-4a2 2 0 0 1 1.8-1h14l-2 6a2 2 0 0 1-1.9 1.4H5a2 2 0 0 1-2-2.4Z"></path></svg>
      </button>
      <button class="browse-button" data-browse="db">Browse</button>
    </div>
    <div class="path-row">
      <label for="authPath">Auth server</label>
      <input id="authPath" type="text" spellcheck="false" placeholder="Required (.exe)" />
      <button class="icon-button" data-reveal="auth" title="Show auth server in File Explorer" aria-label="Show auth server in File Explorer">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v1H8a2 2 0 0 0-1.7.9L3 16V7Z"></path><path d="m3 16 2-4a2 2 0 0 1 1.8-1h14l-2 6a2 2 0 0 1-1.9 1.4H5a2 2 0 0 1-2-2.4Z"></path></svg>
      </button>
      <button class="browse-button" data-browse="auth">Browse</button>
    </div>
    <div class="path-row">
      <label for="worldPath">World server</label>
      <input id="worldPath" type="text" spellcheck="false" placeholder="Required (.exe)" />
      <button class="icon-button" data-reveal="world" title="Show world server in File Explorer" aria-label="Show world server in File Explorer">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v1H8a2 2 0 0 0-1.7.9L3 16V7Z"></path><path d="m3 16 2-4a2 2 0 0 1 1.8-1h14l-2 6a2 2 0 0 1-1.9 1.4H5a2 2 0 0 1-2-2.4Z"></path></svg>
      </button>
      <button class="browse-button" data-browse="world">Browse</button>
    </div>
    <div class="path-row">
      <label for="clientPath">WoW client (optional)</label>
      <input id="clientPath" type="text" spellcheck="false" placeholder="Optional (.exe)" />
      <button class="icon-button" data-reveal="client" title="Show WoW client in File Explorer" aria-label="Show WoW client in File Explorer">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v1H8a2 2 0 0 0-1.7.9L3 16V7Z"></path><path d="m3 16 2-4a2 2 0 0 1 1.8-1h14l-2 6a2 2 0 0 1-1.9 1.4H5a2 2 0 0 1-2-2.4Z"></path></svg>
      </button>
      <button class="browse-button" data-browse="client">Browse</button>
    </div>
  </div>

  <div class="footer">
    <div id="message" role="status" aria-live="polite"></div>
    <div class="actions">
      <button id="cancel" type="button">Cancel</button>
      <button id="save" type="button">Save paths</button>
    </div>
  </div>

  <script src="path-settings.js"></script>
</body>
</html>
